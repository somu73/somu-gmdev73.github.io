<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>そむ。｜ GAME</title>

    <meta
        name="description"
        content="そむ。が制作したゲームをプレイできます。"
    >

    <!-- Site Icon -->
    <link
        rel="icon"
        type="image/jpeg"
        href="images/favicon.jpg"
    >

    <!-- Common CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Play CSS -->
    <link
        rel="stylesheet"
        href="css/play.css"
    >
</head>


<body class="play-page">


    <!-- ==================================================
         Header
    =================================================== -->

    <header class="header">

        <a href="index.html" class="logo">
            そむ。
        </a>


        <nav class="nav">

            <a href="index.html">
                HOME
            </a>

            <a href="games.html">
                GAMES
            </a>

            <a href="index.html#about">
                ABOUT
            </a>

            <a
                href="https://www.youtube.com/@somu_gmdev73"
                target="_blank"
                rel="noopener noreferrer"
                class="external-link"
            >
                YOUTUBE
            </a>

            <a
                href="https://x.com/somu_gmdv73"
                target="_blank"
                rel="noopener noreferrer"
                class="external-link"
            >
                X
            </a>

        </nav>

    </header>



    <!-- ==================================================
         Main
    =================================================== -->

    <main class="play-main">


        <!-- Back -->

        <div class="play-back">

            <a href="games.html">
                ← BACK TO GAMES
            </a>

        </div>



        <!-- ==================================================
             Game Header
        =================================================== -->

        <section class="play-header">

            <p class="section-number">
                GAME
            </p>

            <h1 id="game-title">
                GAME TITLE
            </h1>

            <p
                id="game-meta"
                class="play-meta"
            >
                UNITY
            </p>

        </section>



        <!-- ==================================================
             Game Screen
        =================================================== -->

        <section class="game-player">

            <div
                id="unity-container"
                class="unity-container"
            >

                <!-- Unity WebGL Canvas -->

                <canvas
                    id="unity-canvas"
                    tabindex="-1"
                >
                </canvas>


                <!-- Loading -->

                <div
                    id="unity-loading"
                    class="unity-loading"
                >

                    <p>
                        LOADING
                    </p>

                    <div class="unity-progress">

                        <div
                            id="unity-progress-bar"
                            class="unity-progress-bar"
                        >
                        </div>

                    </div>

                    <span id="unity-progress-text">
                        0%
                    </span>

                </div>


                <!-- Error -->

                <div
                    id="unity-error"
                    class="unity-error"
                    hidden
                >

                    <p>
                        FAILED TO LOAD GAME
                    </p>

                </div>

            </div>

        </section>



        <!-- ==================================================
             Game Information
        =================================================== -->

        <section class="play-information">

            <h2>
                ABOUT THIS GAME
            </h2>

            <p id="game-description">
            </p>

        </section>


    </main>



    <!-- ==================================================
         Footer
    =================================================== -->

    <footer class="games-footer">

        <p>
            © 2026 そむ。
        </p>

    </footer>



    <!-- ==================================================
         JavaScript
    =================================================== -->

    <script src="js/games-data.js"></script>
    <script src="js/play.js"></script>


</body>

</html>
